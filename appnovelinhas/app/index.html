<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0b14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Novelinhas">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-192.png">
<title>Novelinhas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0b0b14;--bg2:#151522;--line:#26263a;--txt:#fff;--mut:#9a9ab0;--gold:#fdc700;--orange:#ffab01;--red:#ff3d5a}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg);color:var(--txt);font-family:'Inter',-apple-system,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
  .app{max-width:520px;margin:0 auto;position:relative}
  button{font-family:inherit;border:0;cursor:pointer;color:inherit;background:none}
  a{color:inherit;text-decoration:none}

  /* header */
  .hdr{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;background:linear-gradient(var(--bg) 60%,transparent)}
  .logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;letter-spacing:-.3px}
  .logo i{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--gold),var(--red));display:flex;align-items:center;justify-content:center}
  .pill{font-size:11px;font-weight:700;padding:5px 10px;border-radius:20px;background:var(--bg2);border:1px solid var(--line);color:var(--mut)}
  .pill.vip{color:#1a1a1a;background:linear-gradient(135deg,#ffe27a,var(--gold));border:0}

  /* hero */
  .hero{position:relative;margin:0 16px;border-radius:18px;overflow:hidden;aspect-ratio:4/5;background:#000}
  .hero img{width:100%;height:100%;object-fit:cover;object-position:top}
  .hero:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(11,11,20,.75) 70%,var(--bg))}
  .hero-c{position:absolute;left:0;right:0;bottom:0;padding:20px;z-index:2;text-align:center}
  .hero h2{font-size:26px;font-weight:800;line-height:1.1}
  .hero h3{font-size:14px;font-weight:600;color:var(--gold);margin:4px 0 10px}
  .chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
  .chip{font-size:11px;color:#ddd;padding:3px 9px;border-radius:12px;background:rgba(255,255,255,.12)}
  .row-btn{display:flex;gap:10px}
  .bplay{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;border-radius:12px;background:#fff;color:#111;font-weight:800;font-size:15px}
  .binfo{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:13px;border-radius:12px;background:rgba(255,255,255,.16);font-weight:700;font-size:14px;backdrop-filter:blur(6px)}

  /* rows */
  .sec{margin-top:28px}
  .sec h4{font-size:17px;font-weight:800;padding:0 16px 12px}
  .rail{display:flex;gap:10px;overflow-x:auto;padding:0 16px;scroll-snap-type:x mandatory;scrollbar-width:none}
  .rail::-webkit-scrollbar{display:none}
  .card{flex:0 0 31%;scroll-snap-align:start;position:relative}
  .card .im{position:relative;aspect-ratio:9/14;border-radius:10px;overflow:hidden;background:var(--bg2)}
  .card img{width:100%;height:100%;object-fit:cover}
  .card p{font-size:12px;font-weight:600;margin-top:6px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .badge{position:absolute;top:6px;left:6px;font-size:9px;font-weight:800;padding:3px 6px;border-radius:5px;background:var(--red)}
  .lock{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center}
  .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--red)}
  .soon{flex:0 0 31%;aspect-ratio:9/14;border-radius:10px;border:1.5px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:10px;color:var(--mut);font-size:11px;font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 16px}
  .grid .card{flex:auto}
  .empty{padding:60px 30px;text-align:center;color:var(--mut);font-size:14px;line-height:1.6}

  /* detalhe */
  .det{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;display:none}
  .det.on{display:block}
  .det-in{max-width:520px;margin:0 auto;padding-bottom:40px}
  .det-top{position:relative;aspect-ratio:3/4;overflow:hidden}
  .det-top img{width:100%;height:100%;object-fit:cover;object-position:top}
  .det-top:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 50%,var(--bg))}
  .back{position:absolute;top:calc(12px + env(safe-area-inset-top));left:12px;z-index:3;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center}
  .det-c{padding:0 18px;margin-top:-60px;position:relative;z-index:2}
  .det h2{font-size:26px;font-weight:800;line-height:1.1}
  .det h3{font-size:14px;color:var(--gold);font-weight:600;margin:4px 0 10px}
  .meta{font-size:12px;color:var(--mut);margin-bottom:16px}
  .det .bplay{width:100%;margin-bottom:10px}
  .bfav{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);font-weight:700;font-size:14px}
  .sin{font-size:14px;line-height:1.6;color:#d6d6e2;margin:18px 0 22px}
  .ep-t{font-size:16px;font-weight:800;margin-bottom:10px}
  .ep{display:flex;gap:12px;align-items:center;padding:10px;border-radius:12px;background:var(--bg2);width:100%;text-align:left}
  .ep img{width:64px;height:90px;object-fit:cover;border-radius:8px}
  .ep b{display:block;font-size:14px}.ep span{font-size:12px;color:var(--mut)}
  .ep .pl{margin-left:auto;width:36px;height:36px;border-radius:50%;background:#fff;color:#111;display:flex;align-items:center;justify-content:center;flex-shrink:0}

  /* player */
  .ply{position:fixed;inset:0;z-index:60;background:#000;display:none;align-items:center;justify-content:center}
  .ply.on{display:flex}
  .ply video{width:100%;height:100%;max-width:520px;object-fit:contain;background:#000}
  .ply .back{background:rgba(0,0,0,.6)}
  .ply-err{position:absolute;color:var(--mut);font-size:14px;text-align:center;padding:30px;display:none}

  /* modal premium */
  .mod{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.8);display:none;align-items:flex-end;justify-content:center}
  .mod.on{display:flex}
  .mod-b{background:#1a1a2e;width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:26px 22px calc(26px + env(safe-area-inset-bottom));text-align:center;border-top:2px solid #d4a853;animation:up .25s ease-out}
  @keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
  .mod-b .pb{display:inline-block;background:#d4a853;color:#1a1a2e;padding:6px 14px;border-radius:16px;font-size:11px;font-weight:800;text-transform:uppercase;margin-bottom:12px}
  .mod-b h3{font-size:21px;font-weight:800;margin-bottom:6px}
  .mod-b p{font-size:14px;color:#cfcfe0;line-height:1.5;margin-bottom:16px}
  .mod-b .pp{font-size:36px;font-weight:800;color:#d4a853;margin-bottom:16px}
  .mod-b a{display:block;padding:15px;border-radius:12px;background:#d4a853;color:#1a1a2e;font-weight:800;text-transform:uppercase;font-size:14px;margin-bottom:10px}
  .mod-b button{font-size:13px;color:#888;padding:8px}

  /* nav */
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(11,11,20,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .nav-in{max-width:520px;margin:0 auto;display:flex}
  .nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0;font-size:11px;font-weight:600;color:var(--mut)}
  .nav button.on{color:#fff}
  .nav button.on svg{stroke:var(--gold)}
  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#fff;color:#111;font-size:13px;font-weight:700;padding:10px 16px;border-radius:20px;z-index:90;opacity:0;transition:opacity .25s;pointer-events:none}
  .toast.on{opacity:1}
</style>
</head>
<body>
<div class="app">
  <header class="hdr">
    <div class="logo"><i><svg width="14" height="14" viewBox="0 0 24 24" fill="#fff"><path d="M7 4v16l13-8z"/></svg></i><span id="nome">Novelinhas</span></div>
    <span class="pill" id="plano">Visitante</span>
  </header>
  <main id="tela"></main>
</div>

<!-- detalhe -->
<div class="det" id="det"><div class="det-in" id="det-in"></div></div>

<!-- player -->
<div class="ply" id="ply">
  <button class="back" id="ply-x" aria-label="Voltar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg></button>
  <video id="vid" controls playsinline preload="metadata"></video>
  <p class="ply-err" id="ply-err">Este vídeo ainda está sendo preparado. Volte em instantes 🙏</p>
</div>

<!-- modal premium -->
<div class="mod" id="mod">
  <div class="mod-b">
    <span class="pb">Upgrade Premium</span>
    <h3>Libere TODAS as novelinhas</h3>
    <p>Acesso a todas as novelinhas do app + as novas que forem entrando, sem pagar nada a mais.</p>
    <div class="pp">R$ 10,00</div>
    <a id="mod-buy" href="#" target="_blank" rel="noopener">Quero o Premium</a>
    <button id="mod-x">Agora não</button>
  </div>
</div>

<nav class="nav"><div class="nav-in">
  <button class="on" data-tab="inicio"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Início</button>
  <button data-tab="lista"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>Minha lista</button>
  <button data-tab="todas"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Catálogo</button>
</div></nav>
<div class="toast" id="toast"></div>

<script src="catalogo.js"></script>
<script>
(function(){
  var C=window.CATALOGO||[], CFG=window.APP_CONFIG||{};
  var $=function(id){return document.getElementById(id)};
  var store={get:function(k,d){try{var v=localStorage.getItem('nv_'+k);return v?JSON.parse(v):d}catch(e){return d}},
             set:function(k,v){try{localStorage.setItem('nv_'+k,JSON.stringify(v))}catch(e){}}};
  var premium=store.get('premium',false), lib=store.get('lib',[]), fav=store.get('fav',[]), prog=store.get('prog',{});
  var tab='inicio', atual=null;
  $('nome').textContent=CFG.nome||'Novelinhas';
  $('mod-buy').href=CFG.checkoutPremium||'#';

  function sha(t){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)).then(function(b){return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')})}
  function liberada(s){return premium||lib.indexOf(s.id)>=0}
  function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function toast(t){var e=$('toast');e.textContent=t;e.classList.add('on');setTimeout(function(){e.classList.remove('on')},2200)}
  function pct(s){var p=prog[s.id];return p&&p.d?Math.min(100,p.t/p.d*100):0}

  /* ---- acesso pelo link recebido: ?acesso=CODIGO  ou  ?s=ID&k=CODIGO ---- */
  function lerLink(){
    var q=new URLSearchParams(location.search), jobs=[];
    var a=(q.get('acesso')||'').trim().toUpperCase();
    if(a) jobs.push(sha(a).then(function(h){if(h===CFG.premium){premium=true;store.set('premium',true);toast('Premium liberado ✨')}}));
    var sid=q.get('s'), k=(q.get('k')||'').trim().toUpperCase();
    if(sid&&k){var s=C.find(function(x){return x.id===sid});
      if(s) jobs.push(sha(k).then(function(h){if(h===s.chave&&lib.indexOf(s.id)<0){lib.push(s.id);store.set('lib',lib);toast('Novelinha liberada ✨')}}));}
    if(q.toString()) history.replaceState(null,'',location.pathname+location.hash);
    return Promise.all(jobs);
  }

  function card(s){
    var p=pct(s);
    return '<button class="card" data-id="'+s.id+'"><div class="im"><img loading="lazy" src="'+esc(s.capa)+'" alt="">'+
      (s.novo?'<span class="badge">NOVO</span>':'')+
      (liberada(s)?'':'<span class="lock"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span>')+
      (p>1?'<span class="bar" style="width:'+p+'%"></span>':'')+
      '</div><p>'+esc(s.titulo)+'</p></button>';
  }
  var soon='<div class="soon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg>Novas novelinhas em breve</div>';

  function render(){
    $('plano').textContent=premium?'Premium':(lib.length?'Meu acesso':'Visitante');
    $('plano').className='pill'+(premium?' vip':'');
    var h='';
    if(tab==='inicio'){
      var d=C[0];
      if(d){h+='<section class="hero"><img src="'+esc(d.capa)+'" alt=""><div class="hero-c"><h2>'+esc(d.titulo)+'</h2><h3>'+esc(d.subtitulo||'')+'</h3>'+
        '<div class="chips">'+[d.idioma,d.duracao].concat(d.generos||[]).filter(Boolean).map(function(g){return '<span class="chip">'+esc(g)+'</span>'}).join('')+'</div>'+
        '<div class="row-btn"><button class="bplay" data-play="'+d.id+'"><svg width="16" height="16" viewBox="0 0 24 24" fill="#111"><path d="M7 4v16l13-8z"/></svg>'+(pct(d)>1?'Continuar':'Assistir')+'</button>'+
        '<button class="binfo" data-id="'+d.id+'"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="16"/><circle cx="12" cy="8" r=".6" fill="#fff"/></svg>Detalhes</button></div></div></section>';}
      var cont=C.filter(function(s){var p=pct(s);return p>1&&p<97});
      if(cont.length) h+='<section class="sec"><h4>Continuar assistindo</h4><div class="rail">'+cont.map(card).join('')+'</div></section>';
      h+='<section class="sec"><h4>Lançamentos 🔥</h4><div class="rail">'+C.slice(0,10).map(card).join('')+soon+'</div></section>';
    }else if(tab==='lista'){
      var l=C.filter(function(s){return fav.indexOf(s.id)>=0});
      h+='<section class="sec" style="margin-top:8px"><h4>Minha lista</h4>'+(l.length?'<div class="grid">'+l.map(card).join('')+'</div>':'<p class="empty">Você ainda não salvou nenhuma novelinha.<br>Toque em <b>+ Minha lista</b> na página da novelinha.</p>')+'</section>';
    }else{
      h+='<section class="sec" style="margin-top:8px"><h4>Todas as novelinhas</h4><div class="grid">'+C.map(card).join('')+soon+'</div></section>';
    }
    $('tela').innerHTML=h;
  }

  function abrirDet(id){
    var s=C.find(function(x){return x.id===id}); if(!s) return; atual=s;
    var f=fav.indexOf(s.id)>=0, p=pct(s);
    $('det-in').innerHTML='<div class="det-top"><button class="back" data-back><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg></button><img src="'+esc(s.capa)+'" alt=""></div>'+
      '<div class="det-c"><h2>'+esc(s.titulo)+'</h2><h3>'+esc(s.subtitulo||'')+'</h3>'+
      '<p class="meta">'+[s.idioma,s.duracao].concat(s.generos||[]).filter(Boolean).map(esc).join(' · ')+'</p>'+
      '<button class="bplay" data-play="'+s.id+'">'+(liberada(s)?'<svg width="16" height="16" viewBox="0 0 24 24" fill="#111"><path d="M7 4v16l13-8z"/></svg>'+(p>1&&p<97?'Continuar':'Assistir agora'):'🔒 Desbloquear')+'</button>'+
      '<button class="bfav" data-fav="'+s.id+'">'+(f?'✓ Na minha lista':'+ Minha lista')+'</button>'+
      '<p class="sin">'+esc(s.sinopse||'')+'</p>'+
      '<p class="ep-t">Episódios</p><button class="ep" data-play="'+s.id+'"><img src="'+esc(s.capa)+'" alt=""><div><b>Completo</b><span>'+esc(s.duracao||'')+(p>1?' · '+Math.round(p)+'% assistido':'')+'</span></div><span class="pl"><svg width="14" height="14" viewBox="0 0 24 24" fill="#111"><path d="M7 4v16l13-8z"/></svg></span></button></div>';
    $('det').classList.add('on'); $('det').scrollTop=0;
  }

  var vid=$('vid'), tocando=null, salvo=0;
  function play(id){
    var s=C.find(function(x){return x.id===id}); if(!s) return;
    if(!liberada(s)){$('mod').classList.add('on');return}
    tocando=s; $('ply-err').style.display='none'; vid.style.display='';
    if(!/^https?:|\.mp4$/i.test(s.video)){vid.style.display='none';$('ply-err').style.display='block';$('ply').classList.add('on');return}
    vid.src=s.video; var p=prog[s.id];
    vid.onloadedmetadata=function(){if(p&&p.t&&p.t<vid.duration-15)vid.currentTime=p.t};
    $('ply').classList.add('on'); vid.play().catch(function(){});
  }
  function salvar(){if(!tocando||!vid.duration)return;prog[tocando.id]={t:vid.currentTime,d:vid.duration};store.set('prog',prog)}
  vid.addEventListener('timeupdate',function(){if(Date.now()-salvo>4000){salvo=Date.now();salvar()}});
  vid.addEventListener('pause',salvar);
  vid.addEventListener('error',function(){if(tocando){vid.style.display='none';$('ply-err').style.display='block'}});
  function fecharPly(){salvar();vid.pause();vid.removeAttribute('src');vid.load();tocando=null;$('ply').classList.remove('on');render();if(atual&&$('det').classList.contains('on'))abrirDet(atual.id)}

  document.addEventListener('click',function(e){
    var t=e.target.closest('[data-id],[data-play],[data-fav],[data-back],[data-tab]'); if(!t) return;
    if(t.dataset.play){play(t.dataset.play)}
    else if(t.dataset.fav){var i=fav.indexOf(t.dataset.fav);if(i>=0)fav.splice(i,1);else{fav.push(t.dataset.fav);toast('Salva na sua lista')}store.set('fav',fav);abrirDet(t.dataset.fav)}
    else if(t.hasAttribute('data-back')){$('det').classList.remove('on');render()}
    else if(t.dataset.tab){tab=t.dataset.tab;document.querySelectorAll('.nav button').forEach(function(b){b.classList.toggle('on',b===t)});render();scrollTo(0,0)}
    else if(t.dataset.id){abrirDet(t.dataset.id)}
  });
  $('ply-x').addEventListener('click',fecharPly);
  $('mod-x').addEventListener('click',function(){$('mod').classList.remove('on')});
  $('mod').addEventListener('click',function(e){if(e.target===$('mod'))$('mod').classList.remove('on')});

  lerLink().then(render);
})();
</script>
</body>
</html>
